<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Махон Хамеш">
    <defs>
        <style>
            .txt { font-family: Arial, sans-serif; font-weight: 700; fill: #1a2340; }
            .txt-small { font-family: Arial, sans-serif; font-weight: 700; fill: #3b7bbf; }
        </style>
    </defs>
    <!-- Звезда Давида -->
    <g transform="translate(60 38)" fill="none" stroke="#3b7bbf" stroke-width="3" stroke-linejoin="round">
        <polygon points="0,-22 19,11 -19,11"/>
        <polygon points="0,22 19,-11 -19,-11"/>
    </g>
    <!-- Текст "ЕВРЕЙСКИЙ УНИВЕРСИТЕТ" -->
    <text x="60" y="82" text-anchor="middle" class="txt" font-size="11">ЕВРЕЙСКИЙ</text>
    <text x="60" y="95" text-anchor="middle" class="txt" font-size="11">УНИВЕРСИТЕТ</text>
    <!-- Подпись -->
    <text x="60" y="112" text-anchor="middle" class="txt-small" font-size="7">КАМПУС МАХОН ХАМЕШ</text>
</svg>
